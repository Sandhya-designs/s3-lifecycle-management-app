<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amazon S3 Lifecycle Management</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 18px;background:#f7f7f7}.card{background:#fff;padding:22px;margin:16px 0;border-radius:12px;box-shadow:0 2px 10px #0001}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}input{padding:10px;margin-right:8px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.status{padding:8px 12px;background:#eee;border-radius:8px;display:inline-block}.success{background:#e7f6e7}.error{background:#fde8e8}</style></head><body><h1>Amazon S3 Lifecycle Management</h1><p>Private S3 bucket + Lambda + API Gateway + presigned S3 URLs.</p><div class="card"><h2>1. Upload document</h2><input id="file" type="file"><button onclick="upload()">Upload</button><p id="uploadStatus" class="status">Ready</p></div><div class="card"><h2>2. Objects in documents/</h2><button onclick="loadObjects()">Refresh objects</button><div id="objects">Loading...</div></div><div class="card"><h2>3. Lifecycle configuration</h2><button onclick="loadLifecycle()">Check lifecycle rule</button><pre id="lifecycle">Click the button to check.</pre></div><script>
async function api(path,o={}){const r=await fetch(path,o),d=await r.json();if(!r.ok)throw Error(d.message||d.error||"Request failed");return d}
async function upload(){const f=document.getElementById('file').files[0],s=document.getElementById('uploadStatus');if(!f){s.textContent='Choose a file first.';return}try{s.textContent='Creating secure upload URL...';const d=await api('/api/upload-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fileName:f.name,contentType:f.type})});s.textContent='Uploading to private S3...';const p=await fetch(d.uploadUrl,{method:'PUT',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});if(!p.ok)throw Error('S3 upload failed');s.textContent='Upload successful: '+d.key;s.className='status success';loadObjects()}catch(e){s.textContent=e.message;s.className='status error'}}
async function loadObjects(){const b=document.getElementById('objects');try{const d=await api('/api/objects');if(!d.objects.length){b.textContent='No objects found.';return}b.innerHTML='<table><tr><th>Key</th><th>Size</th><th>Storage class</th><th>Action</th></tr>'+d.objects.map(o=>`<tr><td>${esc(o.key)}</td><td>${o.size} bytes</td><td>${esc(o.storageClass)}</td><td><button onclick="download('${encodeURIComponent(o.key)}')">Download</button></td></tr>`).join('')+'</table>'}catch(e){b.textContent=e.message}}
async function download(k){try{const d=await api('/api/download-url?key='+k);window.open(d.downloadUrl,'_blank')}catch(e){alert(e.message)}}
async function loadLifecycle(){const b=document.getElementById('lifecycle');try{b.textContent=JSON.stringify(await api('/api/lifecycle'),null,2)}catch(e){b.textContent=e.message}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}loadObjects();loadLifecycle();</script></body></html>
